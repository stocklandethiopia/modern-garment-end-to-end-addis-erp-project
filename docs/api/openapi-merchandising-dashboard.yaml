openapi: 3.1.0
info:
  title: Modern Garment ERP — Merchandising Dashboard API
  version: 1.0.0
  description: >
    Contract for the tenant-scoped WP-04 merchandising dashboard. This
    modular contract documents the verified dashboard endpoint; it is not
    the consolidated contract for all ERP endpoints.
servers:
  - url: /
paths:
  /api/v1/product/merchandising-dashboard:
    get:
      operationId: getMerchandisingDashboard
      summary: Read the current tenant's merchandising dashboard
      description: >
        Returns source-backed planning measures, role-filtered approval and
        personal work queues, and explicit dependency reasons for metrics that
        are not yet calculable. The endpoint is read-only. Values based on
        frozen range plans are planned quantities, not demand or sales actuals.
      security:
        - sanctumBearer: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          description: Tenant UUID selected for the authenticated membership.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant-scoped merchandising dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchandisingDashboardEnvelope'
        '401':
          description: Missing, invalid or expired authentication token.
        '403':
          description: Authenticated actor lacks ERP access or selected tenant membership.
        '422':
          description: Tenant selection header is missing or invalid.
  /api/v1/product/evidence-policies:
    get:
      operationId: listEvidencePolicies
      summary: List tenant-scoped versioned evidence policies
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Paginated tenant policy register.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePolicyPageEnvelope'
        '401': { description: Authentication required. }
        '403': { description: Tenant membership or ERP scope denied. }
    post:
      operationId: createEvidencePolicyDraft
      summary: Create a new evidence policy version in draft state
      description: >
        Tenant owner/administrator only. Rules are configurable per initiative
        type, stage and optional target market. No universal threshold is
        assumed. At least one rule must be mandatory; minimum distinct sources
        cannot exceed minimum records.
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidencePolicyInput'
      responses:
        '201':
          description: Draft policy and rules created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePolicyEnvelope'
        '403': { description: Tenant owner/administrator required. }
        '422': { description: Validation or policy scope error. }
  /api/v1/product/evidence-policies/{policyId}/submit:
    post:
      operationId: submitEvidencePolicy
      summary: Freeze a draft policy and submit it for independent approval
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: policyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Policy enters PENDING_APPROVAL; rule content is frozen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePolicyEnvelope'
        '403': { description: Only the author or tenant owner/administrator may submit. }
        '422': { description: Policy is not a draft or has no mandatory rules. }
  /api/v1/product/evidence-policies/{policyId}/decisions:
    post:
      operationId: decideEvidencePolicy
      summary: Independently approve or reject a submitted evidence policy
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: policyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string, minLength: 10, maxLength: 5000 }
      responses:
        '200':
          description: Immutable append-only maker-checker decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePolicyEnvelope'
        '403': { description: Tenant owner/administrator required; author cannot decide own policy. }
        '422': { description: Policy is not pending or an approved effective scope already overlaps. }
  /api/v1/product/initiatives/{initiativeId}/evidence-coverage:
    get:
      operationId: getInitiativeEvidenceCoverage
      summary: Evaluate the initiative against its matching effective approved evidence policy
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: initiativeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: stage
          in: query
          required: false
          schema: { type: string, enum: [RESEARCH, ASSESSMENT], default: ASSESSMENT }
      responses:
        '200':
          description: Per-initiative rule status, denominators and evidence gaps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceCoverageEnvelope'
        '404': { description: Initiative is not in the selected tenant. }

  /api/v1/product/assortment-plans/{assortmentPlanId}/account-terms:
    get:
      operationId: listAssortmentAccountTerms
      summary: List account-specific terms for one channel assortment
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: assortmentPlanId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Versioned account terms and referenced published price lists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssortmentAccountTermsPageEnvelope' }
        '403': { description: Brand, market or site scope is missing. }
        '404': { description: Assortment is not in the selected tenant. }
    post:
      operationId: createAssortmentAccountTermsDraft
      summary: Create versioned wholesale, reseller, export or customer-programme terms
      description: >
        The service requires a DRAFT assortment with an account reference and
        a PUBLISHED price list that matches tenant, brand, channel, market,
        account and the entire effective period. Commercial, payment, delivery
        and returns values are references to governed source documents only.
        This operation does not create a customer contract, sales order,
        invoice, settlement or payment.
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: assortmentPlanId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssortmentAccountTermsInput' }
      responses:
        '201':
          description: Immutable version draft created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssortmentAccountTermsEnvelope' }
        '403': { description: Brand or market create scope is missing. }
        '422': { description: Price-list channel/account/market/brand/effective period or workflow rule failed. }
  /api/v1/product/assortment-plans/{assortmentPlanId}/account-terms/{termsId}/submit:
    post:
      operationId: submitAssortmentAccountTerms
      summary: Submit account-terms version for independent approval
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: assortmentPlanId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: termsId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Account terms move to PENDING_APPROVAL and content becomes immutable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssortmentAccountTermsEnvelope' }
        '403': { description: Author or tenant administrator submission role required. }
        '422': { description: Terms are not a draft. }
  /api/v1/product/assortment-plans/{assortmentPlanId}/account-terms/{termsId}/decisions:
    post:
      operationId: decideAssortmentAccountTerms
      summary: Independently approve or reject account-specific terms
      security:
        - sanctumBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: assortmentPlanId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: termsId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string, minLength: 10, maxLength: 3000 }
      responses:
        '200':
          description: Append-only maker-checker decision is recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssortmentAccountTermsEnvelope' }
        '403': { description: OWNER/ADMIN scope is required and an author cannot decide their own terms. }
        '422': { description: Terms are not pending, price list is not published, or approved period overlaps another active account terms version. }

components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Laravel Sanctum personal access token
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Tenant UUID selected for the authenticated membership.
      schema: { type: string, format: uuid }
  schemas:
    AssortmentAccountTermsPageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [data, current_page, last_page, total]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AssortmentAccountTerms' }
            current_page: { type: integer }
            last_page: { type: integer }
            total: { type: integer }
    AssortmentAccountTermsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AssortmentAccountTerms'
    AssortmentAccountTerms:
      type: object
      required:
        - id
        - assortment_plan_id
        - price_list_id
        - version_no
        - channel_code
        - market_scope
        - account_reference
        - commercial_terms_reference
        - payment_terms_reference
        - delivery_terms_reference
        - currency
        - minimum_order_units
        - order_multiple_units
        - effective_from
        - status
      properties:
        id: { type: string, format: uuid }
        assortment_plan_id: { type: string, format: uuid }
        price_list_id: { type: string, format: uuid }
        price_list_code: { type: string }
        price_list_currency: { type: string }
        version_no: { type: integer, minimum: 1 }
        channel_code: { type: string, enum: [WHOLESALE, RESELLER, CUSTOMER_PROGRAMME, EXPORT] }
        market_scope: { type: string, maxLength: 160 }
        account_reference: { type: string, maxLength: 120 }
        account_tier: { type: [string, 'null'] }
        commercial_terms_reference: { type: string, maxLength: 160 }
        payment_terms_reference: { type: string, maxLength: 120, description: Reference only; no payment is executed. }
        delivery_terms_reference: { type: string, maxLength: 120 }
        returns_policy_reference: { type: [string, 'null'], maxLength: 120 }
        currency: { type: string, pattern: '^[A-Z]{3}      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MerchandisingDashboard'
    MerchandisingDashboard:
      type: object
      required:
        - generated_at
        - tenant_role
        - initiative_funnel
        - kpis
        - range_lifecycle_mix
        - range_category_depth
        - evidence_register
        - work_queue
        - unavailable_kpis
      properties:
        generated_at:
          type: string
          format: date-time
        tenant_role:
          type: string
          description: Active tenant membership role for the authenticated actor.
        initiative_funnel:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: integer, minimum: 0 }
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/MerchandisingKpi'
        range_lifecycle_mix:
          type: array
          items:
            type: object
            required: [lifecycle_type, range_line_count, planned_units]
            properties:
              lifecycle_type: { type: string }
              range_line_count: { type: integer, minimum: 0 }
              planned_units: { type: integer, minimum: 0 }
        range_category_depth:
          type: array
          items:
            type: object
            required: [category_code, target_tier, range_line_count, planned_units]
            properties:
              category_code: { type: string }
              target_tier: { type: [string, 'null'] }
              range_line_count: { type: integer, minimum: 0 }
              planned_units: { type: integer, minimum: 0 }
        evidence_register:
          type: object
          required: [source_count, insight_count, approved_policy_count, sufficiency_status, sufficiency_reason]
          properties:
            source_count: { type: integer, minimum: 0 }
            insight_count: { type: integer, minimum: 0 }
            approved_policy_count: { type: integer, minimum: 0 }
            sufficiency_status:
              type: string
              enum: [POLICY_CATALOGUE_ACTIVE_COVERAGE_PER_INITIATIVE, NOT_CONFIGURED]
            sufficiency_reason: { type: string }
        work_queue:
          type: object
          required: [approval_scope, approvals, my_work]
          properties:
            approval_scope:
              type: string
              enum: [TENANT_APPROVALS, NOT_AUTHORIZED_FOR_TENANT_APPROVALS]
            approvals:
              type: array
              description: Empty for non-OWNER/ADMIN roles.
              items:
                $ref: '#/components/schemas/MerchandisingWorkItem'
            my_work:
              type: array
              items:
                $ref: '#/components/schemas/MerchandisingWorkItem'
        unavailable_kpis:
          type: array
          items:
            $ref: '#/components/schemas/UnavailableMerchandisingKpi'
    MerchandisingKpi:
      type: object
      required:
        - key
        - label
        - status
        - value
        - unit
        - numerator
        - denominator
        - definition
        - sources
      properties:
        key: { type: string }
        label: { type: string }
        status:
          type: string
          enum: [AVAILABLE, NO_DATA, UNAVAILABLE]
        value: { type: [number, 'null'] }
        unit: { type: string }
        numerator: { type: [integer, 'null'] }
        denominator: { type: [integer, 'null'] }
        definition: { type: string }
        sources:
          type: array
          items: { type: string }
    MerchandisingWorkItem:
      type: object
      required: [type, id, code, title, stage, created_at, href]
      properties:
        type: { type: string }
        id: { type: string }
        code: { type: string }
        title: { type: string }
        stage: { type: string }
        created_at: { type: string, format: date-time }
        href: { type: string }
    UnavailableMerchandisingKpi:
      type: object
      required: [key, reason, dependency]
      properties:
        key: { type: string }
        reason: { type: string }
        dependency: { type: string }
    EvidencePolicyPageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [data, current_page, last_page, total]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/EvidencePolicy' }
            current_page: { type: integer }
            last_page: { type: integer }
            total: { type: integer }
    EvidencePolicyEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [policy, rules]
          properties:
            policy: { $ref: '#/components/schemas/EvidencePolicy' }
            rules:
              type: array
              items: { $ref: '#/components/schemas/EvidencePolicyRule' }
    EvidencePolicy:
      type: object
      required: [id, tenant_id, code, name, initiative_type, stage, version_no, effective_from, status, change_reason, created_by]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        code: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 180 }
        initiative_type:
          type: string
          enum: [NEW_BRAND, NEW_COLLECTION, CATEGORY_EXPANSION, MARKET_ENTRY, PRODUCT_INNOVATION, CUSTOMER_OPPORTUNITY, CAPABILITY_LED, REPLENISHMENT, SUSTAINABILITY_IMPROVEMENT, QUALITY_IMPROVEMENT]
        stage: { type: string, enum: [RESEARCH, ASSESSMENT] }
        target_market: { type: [string, 'null'] }
        version_no: { type: integer, minimum: 1 }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        status: { type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED] }
        change_reason: { type: string }
        created_by: { type: string, format: uuid }
        approved_by: { type: [string, 'null'], format: uuid }
        approved_at: { type: [string, 'null'], format: date-time }
        rule_count: { type: integer, minimum: 0 }
    EvidencePolicyInput:
      type: object
      required: [code, name, initiative_type, stage, effective_from, change_reason, rules]
      properties:
        code: { type: string, minLength: 2, maxLength: 80 }
        name: { type: string, minLength: 3, maxLength: 180 }
        initiative_type:
          type: string
          enum: [NEW_BRAND, NEW_COLLECTION, CATEGORY_EXPANSION, MARKET_ENTRY, PRODUCT_INNOVATION, CUSTOMER_OPPORTUNITY, CAPABILITY_LED, REPLENISHMENT, SUSTAINABILITY_IMPROVEMENT, QUALITY_IMPROVEMENT]
        stage: { type: string, enum: [RESEARCH, ASSESSMENT] }
        target_market: { type: [string, 'null'], maxLength: 160 }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        change_reason: { type: string, minLength: 10, maxLength: 5000 }
        rules:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/EvidencePolicyRuleInput' }
    EvidencePolicyRuleInput:
      type: object
      required: [requirement_code, insight_type, minimum_records, minimum_distinct_sources]
      properties:
        requirement_code: { type: string, maxLength: 80 }
        insight_type:
          type: string
          enum: [OBSERVED_FACT, SURVEY_RESULT, QUALITATIVE_EVIDENCE, EXTERNAL_BENCHMARK, HYPOTHESIS, FORECAST_SIGNAL, CUSTOMER_REQUEST, FIT_OR_QUALITY_FEEDBACK, SUPPLY_OR_CAPACITY_SIGNAL]
        minimum_records: { type: integer, minimum: 1, maximum: 500 }
        minimum_distinct_sources: { type: integer, minimum: 1, maximum: 500 }
        minimum_confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        minimum_source_reliability: { type: [number, 'null'], minimum: 0, maximum: 1 }
        max_age_days: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        require_geography: { type: boolean, default: false }
        require_target_segment: { type: boolean, default: false }
        require_sample_denominator: { type: boolean, default: false }
        is_mandatory: { type: boolean, default: true }
    EvidencePolicyRule:
      allOf:
        - $ref: '#/components/schemas/EvidencePolicyRuleInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    EvidencePolicySummary:
      type: object
      required: [id, code, name, version_no, initiative_type, stage, effective_from]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        version_no: { type: integer, minimum: 1 }
        initiative_type: { type: string }
        stage: { type: string, enum: [RESEARCH, ASSESSMENT] }
        target_market: { type: [string, 'null'] }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
    EvidenceCoverageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [initiative_id, stage, evidence_coverage]
          properties:
            initiative_id: { type: string, format: uuid }
            stage: { type: string, enum: [RESEARCH, ASSESSMENT] }
            evidence_coverage:
              type: object
              required: [status, coverage_percent, mandatory_rules, mandatory_rules_met, policy, rules, message]
              properties:
                status: { type: string, enum: [MET, GAP, NOT_CONFIGURED] }
                coverage_percent: { type: [number, 'null'] }
                mandatory_rules: { type: integer, minimum: 0 }
                mandatory_rules_met: { type: integer, minimum: 0 }
                policy: { oneOf: [{ $ref: '#/components/schemas/EvidencePolicySummary' }, { type: 'null' }] }
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      requirement_code: { type: string }
                      insight_type: { type: string }
                      mandatory: { type: boolean }
                      status: { type: string, enum: [MET, GAP] }
                      observed_records: { type: integer }
                      qualifying_records: { type: integer }
                      distinct_sources: { type: integer }
                      gaps: { type: array, items: { type: string } }
                message: { type: string }

 }
        minimum_order_units: { type: integer, minimum: 0 }
        order_multiple_units: { type: integer, minimum: 1 }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        change_reason: { type: string }
        status: { type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED] }
        created_by: { type: string, format: uuid }
        submitted_by: { type: [string, 'null'], format: uuid }
        decided_by: { type: [string, 'null'], format: uuid }
        decision_reason: { type: [string, 'null'] }
    AssortmentAccountTermsInput:
      type: object
      required:
        - price_list_id
        - commercial_terms_reference
        - payment_terms_reference
        - delivery_terms_reference
        - effective_from
        - change_reason
      properties:
        price_list_id: { type: string, format: uuid }
        account_tier: { type: [string, 'null'], maxLength: 80 }
        commercial_terms_reference: { type: string, minLength: 2, maxLength: 160 }
        payment_terms_reference: { type: string, minLength: 2, maxLength: 120 }
        delivery_terms_reference: { type: string, minLength: 2, maxLength: 120 }
        returns_policy_reference: { type: [string, 'null'], maxLength: 120 }
        minimum_order_units: { type: integer, minimum: 0, default: 0 }
        order_multiple_units: { type: integer, minimum: 1, default: 1 }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        change_reason: { type: string, minLength: 10, maxLength: 3000 }
    MerchandisingDashboardEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MerchandisingDashboard'
    MerchandisingDashboard:
      type: object
      required:
        - generated_at
        - tenant_role
        - initiative_funnel
        - kpis
        - range_lifecycle_mix
        - range_category_depth
        - evidence_register
        - work_queue
        - unavailable_kpis
      properties:
        generated_at:
          type: string
          format: date-time
        tenant_role:
          type: string
          description: Active tenant membership role for the authenticated actor.
        initiative_funnel:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: integer, minimum: 0 }
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/MerchandisingKpi'
        range_lifecycle_mix:
          type: array
          items:
            type: object
            required: [lifecycle_type, range_line_count, planned_units]
            properties:
              lifecycle_type: { type: string }
              range_line_count: { type: integer, minimum: 0 }
              planned_units: { type: integer, minimum: 0 }
        range_category_depth:
          type: array
          items:
            type: object
            required: [category_code, target_tier, range_line_count, planned_units]
            properties:
              category_code: { type: string }
              target_tier: { type: [string, 'null'] }
              range_line_count: { type: integer, minimum: 0 }
              planned_units: { type: integer, minimum: 0 }
        evidence_register:
          type: object
          required: [source_count, insight_count, approved_policy_count, sufficiency_status, sufficiency_reason]
          properties:
            source_count: { type: integer, minimum: 0 }
            insight_count: { type: integer, minimum: 0 }
            approved_policy_count: { type: integer, minimum: 0 }
            sufficiency_status:
              type: string
              enum: [POLICY_CATALOGUE_ACTIVE_COVERAGE_PER_INITIATIVE, NOT_CONFIGURED]
            sufficiency_reason: { type: string }
        work_queue:
          type: object
          required: [approval_scope, approvals, my_work]
          properties:
            approval_scope:
              type: string
              enum: [TENANT_APPROVALS, NOT_AUTHORIZED_FOR_TENANT_APPROVALS]
            approvals:
              type: array
              description: Empty for non-OWNER/ADMIN roles.
              items:
                $ref: '#/components/schemas/MerchandisingWorkItem'
            my_work:
              type: array
              items:
                $ref: '#/components/schemas/MerchandisingWorkItem'
        unavailable_kpis:
          type: array
          items:
            $ref: '#/components/schemas/UnavailableMerchandisingKpi'
    MerchandisingKpi:
      type: object
      required:
        - key
        - label
        - status
        - value
        - unit
        - numerator
        - denominator
        - definition
        - sources
      properties:
        key: { type: string }
        label: { type: string }
        status:
          type: string
          enum: [AVAILABLE, NO_DATA, UNAVAILABLE]
        value: { type: [number, 'null'] }
        unit: { type: string }
        numerator: { type: [integer, 'null'] }
        denominator: { type: [integer, 'null'] }
        definition: { type: string }
        sources:
          type: array
          items: { type: string }
    MerchandisingWorkItem:
      type: object
      required: [type, id, code, title, stage, created_at, href]
      properties:
        type: { type: string }
        id: { type: string }
        code: { type: string }
        title: { type: string }
        stage: { type: string }
        created_at: { type: string, format: date-time }
        href: { type: string }
    UnavailableMerchandisingKpi:
      type: object
      required: [key, reason, dependency]
      properties:
        key: { type: string }
        reason: { type: string }
        dependency: { type: string }
    EvidencePolicyPageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [data, current_page, last_page, total]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/EvidencePolicy' }
            current_page: { type: integer }
            last_page: { type: integer }
            total: { type: integer }
    EvidencePolicyEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [policy, rules]
          properties:
            policy: { $ref: '#/components/schemas/EvidencePolicy' }
            rules:
              type: array
              items: { $ref: '#/components/schemas/EvidencePolicyRule' }
    EvidencePolicy:
      type: object
      required: [id, tenant_id, code, name, initiative_type, stage, version_no, effective_from, status, change_reason, created_by]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        code: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 180 }
        initiative_type:
          type: string
          enum: [NEW_BRAND, NEW_COLLECTION, CATEGORY_EXPANSION, MARKET_ENTRY, PRODUCT_INNOVATION, CUSTOMER_OPPORTUNITY, CAPABILITY_LED, REPLENISHMENT, SUSTAINABILITY_IMPROVEMENT, QUALITY_IMPROVEMENT]
        stage: { type: string, enum: [RESEARCH, ASSESSMENT] }
        target_market: { type: [string, 'null'] }
        version_no: { type: integer, minimum: 1 }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        status: { type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED, REJECTED] }
        change_reason: { type: string }
        created_by: { type: string, format: uuid }
        approved_by: { type: [string, 'null'], format: uuid }
        approved_at: { type: [string, 'null'], format: date-time }
        rule_count: { type: integer, minimum: 0 }
    EvidencePolicyInput:
      type: object
      required: [code, name, initiative_type, stage, effective_from, change_reason, rules]
      properties:
        code: { type: string, minLength: 2, maxLength: 80 }
        name: { type: string, minLength: 3, maxLength: 180 }
        initiative_type:
          type: string
          enum: [NEW_BRAND, NEW_COLLECTION, CATEGORY_EXPANSION, MARKET_ENTRY, PRODUCT_INNOVATION, CUSTOMER_OPPORTUNITY, CAPABILITY_LED, REPLENISHMENT, SUSTAINABILITY_IMPROVEMENT, QUALITY_IMPROVEMENT]
        stage: { type: string, enum: [RESEARCH, ASSESSMENT] }
        target_market: { type: [string, 'null'], maxLength: 160 }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        change_reason: { type: string, minLength: 10, maxLength: 5000 }
        rules:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/EvidencePolicyRuleInput' }
    EvidencePolicyRuleInput:
      type: object
      required: [requirement_code, insight_type, minimum_records, minimum_distinct_sources]
      properties:
        requirement_code: { type: string, maxLength: 80 }
        insight_type:
          type: string
          enum: [OBSERVED_FACT, SURVEY_RESULT, QUALITATIVE_EVIDENCE, EXTERNAL_BENCHMARK, HYPOTHESIS, FORECAST_SIGNAL, CUSTOMER_REQUEST, FIT_OR_QUALITY_FEEDBACK, SUPPLY_OR_CAPACITY_SIGNAL]
        minimum_records: { type: integer, minimum: 1, maximum: 500 }
        minimum_distinct_sources: { type: integer, minimum: 1, maximum: 500 }
        minimum_confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        minimum_source_reliability: { type: [number, 'null'], minimum: 0, maximum: 1 }
        max_age_days: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        require_geography: { type: boolean, default: false }
        require_target_segment: { type: boolean, default: false }
        require_sample_denominator: { type: boolean, default: false }
        is_mandatory: { type: boolean, default: true }
    EvidencePolicyRule:
      allOf:
        - $ref: '#/components/schemas/EvidencePolicyRuleInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    EvidencePolicySummary:
      type: object
      required: [id, code, name, version_no, initiative_type, stage, effective_from]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        version_no: { type: integer, minimum: 1 }
        initiative_type: { type: string }
        stage: { type: string, enum: [RESEARCH, ASSESSMENT] }
        target_market: { type: [string, 'null'] }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
    EvidenceCoverageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [initiative_id, stage, evidence_coverage]
          properties:
            initiative_id: { type: string, format: uuid }
            stage: { type: string, enum: [RESEARCH, ASSESSMENT] }
            evidence_coverage:
              type: object
              required: [status, coverage_percent, mandatory_rules, mandatory_rules_met, policy, rules, message]
              properties:
                status: { type: string, enum: [MET, GAP, NOT_CONFIGURED] }
                coverage_percent: { type: [number, 'null'] }
                mandatory_rules: { type: integer, minimum: 0 }
                mandatory_rules_met: { type: integer, minimum: 0 }
                policy: { oneOf: [{ $ref: '#/components/schemas/EvidencePolicySummary' }, { type: 'null' }] }
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      requirement_code: { type: string }
                      insight_type: { type: string }
                      mandatory: { type: boolean }
                      status: { type: string, enum: [MET, GAP] }
                      observed_records: { type: integer }
                      qualifying_records: { type: integer }
                      distinct_sources: { type: integer }
                      gaps: { type: array, items: { type: string } }
                message: { type: string }

