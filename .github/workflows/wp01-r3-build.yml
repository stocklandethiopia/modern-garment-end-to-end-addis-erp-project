name: WP-01 r3 source verification and build

on:
  push:
    branches:
      - work/wp01-16-completion-2026-11-26
    paths:
      - 'work-packages/wp-01-requirements-traceability/**'
      - '.github/workflows/wp01-r3-build.yml'
  pull_request:
    branches:
      - delivery/autonomous-wp-01-16
    paths:
      - 'work-packages/wp-01-requirements-traceability/**'
      - '.github/workflows/wp01-r3-build.yml'

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify WP-01 r3 requirements and source package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Reassemble and verify archive SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp01-r3
          cat work-packages/wp-01-requirements-traceability/source/WP01_R3_SOURCE_2026-11-26.tar.xz.b64.part-* | base64 --decode > /tmp/WP01_R3_SOURCE_2026-11-26.tar.xz
          echo '44f69b36d6ed389633d4e305dacfa825fbdffb99d78cc903e3f050761811a6e7  /tmp/WP01_R3_SOURCE_2026-11-26.tar.xz' | sha256sum --check
          tar -xJf /tmp/WP01_R3_SOURCE_2026-11-26.tar.xz -C /tmp/wp01-r3

      - name: Verify every embedded package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wp01-r3/wp01-r2-release
          sha256sum --check CHECKSUMS.sha256

      - name: Set up supported WP-01 Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'

      - name: Validate, test and strict audit
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wp01-r3/wp01-r2-release/package
          node scripts/validate-work-package.mjs
          node --test
          node scripts/audit-quality.mjs --strict --markdown docs/WP01_AUDIT_RESULT_CI.md

      - name: Build source and review ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp /tmp/WP01_R3_SOURCE_2026-11-26.tar.xz "$GITHUB_WORKSPACE/dist/"
          cd /tmp/wp01-r3
          zip -qr "$GITHUB_WORKSPACE/dist/MODERN_GARMENT_END_TO_END_ADDIS_ERP_WP01_r3_2026-11-26.zip" wp01-r2-release
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum WP01_R3_SOURCE_2026-11-26.tar.xz MODERN_GARMENT_END_TO_END_ADDIS_ERP_WP01_r3_2026-11-26.zip > SHA256SUMS.txt

      - name: Publish immutable review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wp01-r3-source-and-build-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
