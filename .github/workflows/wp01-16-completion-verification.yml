name: ERP WP-01–WP-16 completion verification

on:
  push:
    branches:
      - work/wp01-16-completion-2026-11-26
      - work/wp03-completion-2026-11-27
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'work-packages/**'
      - 'docs/**'
      - '.github/workflows/wp01-16-completion-verification.yml'
  pull_request:
    branches:
      - delivery/autonomous-wp-01-16
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'work-packages/**'
      - 'docs/**'
      - '.github/workflows/wp01-16-completion-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-wp01-wp16-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-postgresql:
    name: Laravel 13 / PHP 8.5 / PostgreSQL 18 / Redis 8.2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: erp_test
      DB_USERNAME: app_runtime
      DB_PASSWORD: runtime-password
      MIGRATION_DB_USERNAME: erp_migrator
      MIGRATION_DB_PASSWORD: migrator-password
      TEST_DB_ADMIN_USERNAME: erp_test_admin
      TEST_DB_ADMIN_PASSWORD: test-admin-password
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_DB: '0'
      REDIS_CACHE_DB: '1'
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, intl, json, mbstring, openssl, pdo, pdo_pgsql, redis, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js 26 toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create restricted migration and runtime roles
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h localhost -U postgres -d erp_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE erp_migrator LOGIN CREATEROLE CREATEDB BYPASSRLS PASSWORD 'migrator-password';
          CREATE ROLE app_runtime LOGIN NOBYPASSRLS PASSWORD 'runtime-password';
          CREATE ROLE erp_test_admin LOGIN BYPASSRLS PASSWORD 'test-admin-password';
          ALTER DATABASE erp_test OWNER TO erp_migrator;
          GRANT CONNECT, TEMPORARY ON DATABASE erp_test TO app_runtime, erp_test_admin;
          GRANT app_runtime TO erp_migrator;
          -- Test fixtures only: this account never runs the application. It needs
          -- explicit table/sequence rights for setup while bypassing RLS.
          ALTER DEFAULT PRIVILEGES FOR ROLE erp_migrator IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO erp_test_admin;
          ALTER DEFAULT PRIVILEGES FOR ROLE erp_migrator IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO erp_test_admin;
          SQL
        working-directory: .

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata and vulnerabilities
        run: |
          composer validate --strict
          composer audit --no-interaction

      - name: Prepare Laravel testing environment
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --force

      - name: Run ordered database migrations as the controlled migration role
        run: DB_CONNECTION=pgsql_migrator php artisan migrate --force

      - name: Verify forced RLS on new tenant tables
        run: |
          set -euo pipefail
          PGPASSWORD=migrator-password psql -h localhost -U erp_migrator -d erp_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE t text;
          BEGIN
            FOREACH t IN ARRAY ARRAY[
              'supplier_accounts','sourcing_events','supplier_quotes','purchase_orders',
              'purchase_order_lines','goods_receipts','goods_receipt_lines','material_lots',
              'fabric_rolls','trim_lots','inventory_transactions','process_route_versions',
              'process_route_steps','production_orders','production_order_operations',
              'production_execution_events','cutting_bundles','bundle_operation_events',
              'quality_defect_catalog','quality_inspections','quality_nonconformances',
              'quality_corrective_actions','quality_release_decisions','customer_orders',
              'customer_order_lines','shipments','shipment_lines','operation_standard_versions',
              'work_centres','work_shift_definitions','capacity_calendar_slots',
              'production_plan_versions','production_plan_lines','workforce_skill_records',
              'workforce_assignments','incentive_policy_versions','incentive_calculation_drafts',
              'finance_periods','finance_accounts','finance_journals','finance_journal_lines',
              'statutory_rule_versions','payroll_run_drafts','payroll_run_lines',
              'document_assets','document_extraction_runs','integration_endpoint_registry',
              'integration_outbox_events','agent_run_audits','agent_action_proposals',
              'agent_approval_decisions','agent_action_events','device_scan_events',
              'receipt_line_material_lots','finished_goods_lots','finished_goods_transactions',
              'finished_goods_reservations','finance_journal_postings','finance_journal_reversals','customer_credit_decisions','tenant_domain_role_assignments'
            ] LOOP
              IF NOT EXISTS (
                SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                 WHERE n.nspname='public' AND c.relname=t AND c.relrowsecurity AND c.relforcerowsecurity
              ) THEN
                RAISE EXCEPTION 'RLS missing or not forced on public.%', t;
              END IF;
            END LOOP;
          END $$;
          SQL
        working-directory: .

      - name: Run PHP formatting check
        run: |
          if [ -x vendor/bin/pint ]; then vendor/bin/pint --test; fi

      - name: Run Laravel unit and integration tests
        run: php artisan test

      - name: Verify route registration
        run: php artisan route:list --json > /tmp/erp-routes.json

  frontend-angular:
    name: Angular 22 / Node 26 build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Run Angular unit tests
        run: npm test -- --watch=false

      - name: Build production Angular application
        run: npm run build

  wp01-source-package:
    name: WP-01 r3 source integrity and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js 26 for WP-01 package verification
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'

      - name: Reassemble and verify WP-01 r3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp01-r3-source
          cat work-packages/wp-01-requirements-traceability/source/WP01_R3_SOURCE_2026-11-26.tar.xz.b64.part-* | base64 --decode > /tmp/WP01_R3_SOURCE_2026-11-26.tar.xz
          echo '44f69b36d6ed389633d4e305dacfa825fbdffb99d78cc903e3f050761811a6e7  /tmp/WP01_R3_SOURCE_2026-11-26.tar.xz' | sha256sum --check
          tar -xJf /tmp/WP01_R3_SOURCE_2026-11-26.tar.xz -C /tmp/wp01-r3-source
          cd /tmp/wp01-r3-source
          sha256sum --check wp01-r2-release/CHECKSUMS.sha256
          cd wp01-r2-release/package
          node scripts/validate-work-package.mjs
          node --test
          node scripts/audit-quality.mjs --strict --markdown docs/WP01_AUDIT_RESULT_CI.md

  combined-release-candidate:
    name: Assemble combined ERP repository candidate
    needs: [backend-postgresql, frontend-angular, wp01-source-package]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@v4

      - name: Create source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix=modern-garment-addis-erp/ HEAD > dist/modern-garment-addis-erp-wp01-wp16-candidate.tar.gz
          sha256sum dist/modern-garment-addis-erp-wp01-wp16-candidate.tar.gz > dist/SHA256SUMS.txt
          {
            echo "# Combined ERP candidate build"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch/ref: ${GITHUB_REF}"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "All required backend, frontend and WP-01 source-package jobs succeeded."
            echo "This artifact is a review candidate; production deployment and professional sign-offs remain separate gates."
          } > dist/BUILD-VERIFICATION.md

      - name: Publish combined review artifact
        uses: actions/upload-artifact@v4
        with:
          name: modern-garment-addis-erp-wp01-wp16-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 90
