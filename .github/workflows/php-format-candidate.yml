name: Normalize candidate PHP formatting

on:
  push:
    branches:
      - work/wp01-16-completion-2026-11-26
    paths:
      - 'backend/app/**/*.php'
      - 'backend/database/**/*.php'
      - 'backend/routes/**/*.php'
      - 'backend/tests/**/*.php'
      - '.github/workflows/php-format-candidate.yml'

permissions:
  contents: write

concurrency:
  group: php-format-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-and-lint:
    name: Pint format and PHP syntax validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: work/wp01-16-completion-2026-11-26
          persist-credentials: true

      - name: Set up PHP 8.5 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, intl, json, mbstring, openssl, pdo, pdo_pgsql, redis, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install locked backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply repository Pint rules
        run: vendor/bin/pint

      - name: Lint every PHP source file
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify Pint cleanliness after formatting
        run: vendor/bin/pint --test

      - name: Commit style-only normalization to candidate
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app backend/bootstrap backend/config backend/database backend/routes backend/tests
          if git diff --cached --quiet; then
            echo "No PHP formatting changes remain."
            exit 0
          fi
          git commit -m "style(php): apply repository Pint rules"
          git fetch origin work/wp01-16-completion-2026-11-26
          git rebase origin/work/wp01-16-completion-2026-11-26
          git push origin HEAD:refs/heads/work/wp01-16-completion-2026-11-26
