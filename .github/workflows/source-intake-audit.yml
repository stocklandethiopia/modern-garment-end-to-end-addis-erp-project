name: Stockland local source intake audit

on:
  push:
    branches:
      - audit/stockland-local-source-v0.3.0
    paths:
      - source-intake/stockland-garment-erp-local-v0.3.0/archive-parts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockland-source-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-commit-and-audit:
    name: Extract and audit supplied source on GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Reconstruct and verify original ZIP
        shell: bash
        run: |
          set -euo pipefail
          intake="source-intake/stockland-garment-erp-local-v0.3.0"
          archive="$RUNNER_TEMP/STOCKLAND_GARMENT_ERP_LOCAL_FULLSTACK_v0.3.0.zip"
          cat "$intake"/archive-parts/*.b64 | base64 --decode > "$archive"
          echo "5e505f3ccccf930d8644187a3143c5277edae2ac9de3bd9f4305945232668fd1  $archive" | sha256sum --check -
          unzip -tq "$archive"
          mkdir -p "$RUNNER_TEMP/source-unpacked"
          unzip -q "$archive" -d "$RUNNER_TEMP/source-unpacked"
          test -f "$RUNNER_TEMP/source-unpacked/STOCKLAND_GARMENT_ERP_LOCAL_FULLSTACK/package.json"
          test -f "$RUNNER_TEMP/source-unpacked/STOCKLAND_GARMENT_ERP_LOCAL_FULLSTACK/BUILD_MANIFEST.json"

      - name: Commit extracted application source to audit branch
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/source-unpacked/STOCKLAND_GARMENT_ERP_LOCAL_FULLSTACK"
          destination="source-intake/stockland-garment-erp-local-v0.3.0/source"
          mkdir -p "$destination"
          cp -a "$source_root"/. "$destination"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination"
          if git diff --cached --quiet; then
            echo "Extracted source is already committed."
          else
            git commit -m "chore(audit): commit extracted Stockland ERP v0.3.0 source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check JavaScript syntax and static rules
        working-directory: source-intake/stockland-garment-erp-local-v0.3.0/source
        run: npm run check

      - name: Run application integration tests
        working-directory: source-intake/stockland-garment-erp-local-v0.3.0/source
        run: npm test

      - name: Verify source build manifest
        working-directory: source-intake/stockland-garment-erp-local-v0.3.0/source
        run: npm run verify:manifest

      - name: Run submitted application's release gate
        working-directory: source-intake/stockland-garment-erp-local-v0.3.0/source
        run: npm run release:gate

      - name: Publish expanded source package for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockland-garment-erp-local-source-v0.3.0
          path: source-intake/stockland-garment-erp-local-v0.3.0/source/
          if-no-files-found: warn
          retention-days: 14
