name: Workspace source snapshot (temporary engineering aid)

on:
  push:
    branches:
      - work/wp01-16-completion-2026-11-26
    paths:
      - '.github/workflows/workspace-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact checked-out source
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=repository-source.tar.gz HEAD
          sha256sum repository-source.tar.gz > repository-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: exact-source-snapshot-${{ github.sha }}
          path: |
            repository-source.tar.gz
            repository-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
