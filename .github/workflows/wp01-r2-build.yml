name: WP-01 r2 source verification and build

on:
  push:
    branches:
      - feature/wp01-r2-review-bundle-2026-11-26
    paths:
      - 'work-packages/wp-01-requirements-traceability/**'
      - '.github/workflows/wp01-r2-build.yml'
  pull_request:
    branches:
      - audit/corrective-action-plan-2026-11-24
    paths:
      - 'work-packages/wp-01-requirements-traceability/**'
      - '.github/workflows/wp01-r2-build.yml'

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify WP-01 source and package artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp01-r2-source
          cat work-packages/wp-01-requirements-traceability/source/WP01_R2_SOURCE_2026-11-26.tar.xz.b64.part-* | base64 --decode > /tmp/WP01_R2_SOURCE_2026-11-26.tar.xz
          echo '5c0a0ba496a86cac7ae52c70e057d3cc050600d168e362194b8af722c233e2d7  /tmp/WP01_R2_SOURCE_2026-11-26.tar.xz' | sha256sum --check
          tar -xJf /tmp/WP01_R2_SOURCE_2026-11-26.tar.xz -C /tmp/wp01-r2-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'

      - name: Verify embedded release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wp01-r2-source/wp01-r2-release
          sha256sum --check CHECKSUMS.sha256

      - name: Run WP-01 validation and tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wp01-r2-source/wp01-r2-release/package
          node scripts/validate-work-package.mjs
          node --test
          node scripts/audit-quality.mjs

      - name: Build distributable source and ZIP bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp /tmp/WP01_R2_SOURCE_2026-11-26.tar.xz "$GITHUB_WORKSPACE/dist/"
          cd /tmp/wp01-r2-source
          zip -qr "$GITHUB_WORKSPACE/dist/MODERN_GARMENT_END_TO_END_ADDIS_ERP_WP01_r2_2026-11-26.zip" wp01-r2-release
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum WP01_R2_SOURCE_2026-11-26.tar.xz MODERN_GARMENT_END_TO_END_ADDIS_ERP_WP01_r2_2026-11-26.zip > SHA256SUMS.txt

      - name: Publish review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wp01-r2-source-and-build-2026-11-26
          path: dist/*
          if-no-files-found: error
          retention-days: 90
