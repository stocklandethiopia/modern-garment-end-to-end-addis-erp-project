name: Inspect authoritative Drive source intake

on:
  push:
    branches:
      - audit/stockland-local-source-v0.3.0
      - audit/inspect-drive-folder-2026-11-24
    paths:
      - source-intake/stockland-garment-erp-local-v0.3.0/AUTHORITATIVE_SOURCE_REVIEW_TRIGGER
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-drive-folder:
    name: Download and inventory supplied Drive folder (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRIVE_FOLDER_ID: 1o4y6s2hP81sNra93112sV7ldJNty9-2
    steps:
      - name: Checkout current audit snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retry listing and download all supplied Drive files read-only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "gdown==5.2.0"
          python - "$DRIVE_FOLDER_ID" "$RUNNER_TEMP/drive-intake-download" <<'PY'
          import sys, json, pathlib, hashlib, concurrent.futures, gdown, time, zipfile, tarfile
          folder_id, output = sys.argv[1], sys.argv[2]
          root = pathlib.Path(output)
          files_root = root / "files"
          files_root.mkdir(parents=True, exist_ok=True)
          errors = []
          listing = []
          for attempt in range(1, 5):
              try:
                  files = gdown.download_folder(
                      url=f"https://drive.google.com/drive/folders/{folder_id}",
                      quiet=True,
                      remaining_ok=True,
                      skip_download=True,
                  )
                  listing = []
                  for f in files or []:
                      rel = pathlib.PurePosixPath(f.path)
                      if rel.is_absolute() or ".." in rel.parts:
                          errors.append(f"Unsafe path returned by Drive listing: {f.path}")
                          continue
                      listing.append({"id": f.id, "path": rel.as_posix()})
                  if listing:
                      break
                  errors.append(f"Attempt {attempt}: Drive listing returned no files.")
              except Exception as exc:
                  errors.append(f"Attempt {attempt}: {type(exc).__name__}: {exc}")
              if attempt < 4:
                  time.sleep(5 * attempt)

          def sha256(path):
              h=hashlib.sha256()
              with open(path,"rb") as f:
                  for block in iter(lambda:f.read(1024*1024),b""):
                      h.update(block)
              return h.hexdigest()

          def download(item):
              rel=pathlib.PurePosixPath(item["path"])
              dest=files_root.joinpath(*rel.parts)
              dest.parent.mkdir(parents=True,exist_ok=True)
              try:
                  result=gdown.download(id=item["id"],output=str(dest),quiet=True)
                  if not result or not dest.is_file():
                      raise RuntimeError("gdown returned no downloaded file")
                  return {"path":item["path"],"drive_file_id":item["id"],"status":"DOWNLOADED",
                          "size_bytes":dest.stat().st_size,"sha256":sha256(dest)}
              except Exception as exc:
                  return {"path":item["path"],"drive_file_id":item["id"],"status":"FAILED","error":str(exc)}

          results=[]
          if listing:
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  results=list(pool.map(download,listing))

          direct_package_roots={str(pathlib.PurePosixPath(x["path"]).parent) for x in results
                                if x["status"]=="DOWNLOADED" and pathlib.PurePosixPath(x["path"]).name=="package.json"}
          direct_manifest_roots={str(pathlib.PurePosixPath(x["path"]).parent) for x in results
                                 if x["status"]=="DOWNLOADED" and pathlib.PurePosixPath(x["path"]).name=="BUILD_MANIFEST.json"}
          archives=[]
          for item in results:
              if item["status"]!="DOWNLOADED":
                  continue
              p=files_root.joinpath(*pathlib.PurePosixPath(item["path"]).parts)
              low=p.name.casefold()
              try:
                  if low.endswith(".zip"):
                      with zipfile.ZipFile(p) as z:
                          members=[x for x in z.namelist() if not x.endswith("/")]
                  elif low.endswith(".tar.gz") or low.endswith(".tgz"):
                      with tarfile.open(p,"r:gz") as t:
                          members=[x.name for x in t.getmembers() if x.isfile()]
                  else:
                      continue
                  safe=all(not pathlib.PurePosixPath(x).is_absolute() and ".." not in pathlib.PurePosixPath(x).parts for x in members)
                  package_roots={str(pathlib.PurePosixPath(x).parent) for x in members if pathlib.PurePosixPath(x).name=="package.json"}
                  manifest_roots={str(pathlib.PurePosixPath(x).parent) for x in members if pathlib.PurePosixPath(x).name=="BUILD_MANIFEST.json"}
                  archives.append({"path":item["path"],"member_count":len(members),"safe_paths":safe,
                                   "application_roots":sorted(package_roots & manifest_roots)})
              except Exception as exc:
                  archives.append({"path":item["path"],"inspection_error":str(exc)})

          failed=sum(x["status"]!="DOWNLOADED" for x in results)
          state="BLOCKED_DRIVE_LISTING" if not listing else ("PARTIAL_DOWNLOAD" if failed else "FILES_DOWNLOADED")
          inventory={"drive_folder_id":folder_id,"status":state,"listing_errors":errors,
                     "listed_file_count":len(listing),"downloaded_file_count":len(results)-failed,
                     "failed_file_count":failed,"files":results,"direct_application_roots":sorted(direct_package_roots & direct_manifest_roots),
                     "archives":archives}
          (root/"drive-folder-inventory.json").write_text(json.dumps(inventory,indent=2),encoding="utf-8")
          summary=["# Authoritative Drive folder inventory","",
                   f"- Drive folder ID: `{folder_id}`",f"- Status: **{state}**",
                   f"- Listed files: {len(listing)}",f"- Downloaded: {len(listing)-failed}",
                   f"- Failed: {failed}",f"- Direct app roots (package + manifest): {len(direct_package_roots & direct_manifest_roots)}",
                   f"- Archives detected: {len(archives)}","","## Listing/download errors"]
          summary += [f"- {x}" for x in errors] or ["- None."]
          summary += ["","## File inventory"]
          summary += [f"- `{x['path']}`: {x['status']}, size={x.get('size_bytes','')}, SHA-256={x.get('sha256','')}, error={x.get('error','')}" for x in results]
          summary += ["","## Archive inspection"]
          summary += [f"- `{x['path']}`: {json.dumps(x,sort_keys=True)}" for x in archives]
          summary += ["","## Decision","",
                      "This workflow only downloads and inventories the supplied Drive folder. It does not change the committed application source. A source application may be promoted only after its complete extracted root, build manifest, per-file hashes, licensing/provenance and compatibility with the approved canonical ERP architecture are reviewed."]
          (root/"drive-folder-inventory.md").write_text("\n".join(summary)+"\n",encoding="utf-8")
          (root/"SHA256SUMS.txt").write_text("\n".join(f"{x['sha256']}  {x['path']}" for x in results if x["status"]=="DOWNLOADED")+"\n",encoding="utf-8")
          print((root/"drive-folder-inventory.md").read_text(encoding="utf-8"))
          PY

      - name: Publish downloaded Drive source files and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-drive-folder-download
          path: ${{ runner.temp }}/drive-intake-download/
          if-no-files-found: error
          retention-days: 14

      - name: Add source inventory to GitHub Actions summary
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/drive-intake-download/drive-folder-inventory.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
