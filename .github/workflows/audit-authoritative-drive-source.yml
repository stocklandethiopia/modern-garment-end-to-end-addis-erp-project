name: Inspect authoritative Drive source intake

on:
  push:
    branches:
      - audit/stockland-local-source-v0.3.0
      - audit/inspect-drive-folder-2026-11-24
    paths:
      - source-intake/stockland-garment-erp-local-v0.3.0/AUTHORITATIVE_SOURCE_REVIEW_TRIGGER
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-drive-folder:
    name: Download and inventory supplied Drive folder (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRIVE_FOLDER_ID: 1o4y6s2hP81sNra93112sV7ldJNty9-2
    steps:
      - name: Checkout current audit snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve authoritative Drive folder listing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "gdown==5.2.0"
          python - "$DRIVE_FOLDER_ID" "$RUNNER_TEMP/drive-listing.json" <<'PY'
          import sys, json, pathlib, gdown
          folder_id, output = sys.argv[1], sys.argv[2]
          files = gdown.download_folder(
              url=f"https://drive.google.com/drive/folders/{folder_id}",
              quiet=True,
              remaining_ok=True,
              skip_download=True,
          )
          payload = []
          for f in files or []:
              rel = pathlib.PurePosixPath(f.path)
              if rel.is_absolute() or ".." in rel.parts:
                  raise SystemExit(f"Unsafe path returned by Drive listing: {f.path}")
              payload.append({"id": f.id, "path": rel.as_posix(), "local_path": f.local_path})
          if not payload:
              raise SystemExit("The supplied Drive folder returned no files.")
          payload.sort(key=lambda x: x["path"].casefold())
          with open(output, "w", encoding="utf-8") as out:
              json.dump(payload, out, indent=2)
          print(f"Drive folder listing resolved: {len(payload)} files.")
          for item in payload:
              print(f"- {item['path']} (Drive file ID {item['id']})")
          PY
          echo "DRIVE_LISTING=$RUNNER_TEMP/drive-listing.json" >> "$GITHUB_ENV"

      - name: Download exact Drive files and build SHA-256 inventory
        shell: bash
        run: |
          set -euo pipefail
          python - "$DRIVE_LISTING" "$RUNNER_TEMP/drive-intake-download" <<'PY'
          import sys, json, pathlib, hashlib, concurrent.futures, gdown, zipfile, tarfile
          listing=json.load(open(sys.argv[1],encoding="utf-8"))
          root=pathlib.Path(sys.argv[2])
          files_root=root/"files"
          files_root.mkdir(parents=True,exist_ok=True)

          def digest(path):
              h=hashlib.sha256()
              with open(path,"rb") as f:
                  for block in iter(lambda:f.read(1024*1024),b""):
                      h.update(block)
              return h.hexdigest()

          def download(item):
              rel=pathlib.PurePosixPath(item["path"])
              if rel.is_absolute() or ".." in rel.parts:
                  return {"path":item["path"],"drive_file_id":item["id"],"status":"BLOCKED_UNSAFE_PATH"}
              dest=files_root.joinpath(*rel.parts)
              dest.parent.mkdir(parents=True,exist_ok=True)
              try:
                  result=gdown.download(id=item["id"],output=str(dest),quiet=True)
                  if not result or not dest.is_file():
                      raise RuntimeError("gdown returned no file")
                  return {"path":item["path"],"drive_file_id":item["id"],"status":"DOWNLOADED",
                          "size_bytes":dest.stat().st_size,"sha256":digest(dest)}
              except Exception as exc:
                  return {"path":item["path"],"drive_file_id":item["id"],"status":"FAILED","error":str(exc)}

          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              results=list(pool.map(download,listing))

          app_roots=set()
          for rel in [x["path"] for x in results if x["status"]=="DOWNLOADED"]:
              p=pathlib.PurePosixPath(rel)
              if p.name=="package.json":
                  app_roots.add(str(p.parent))
          direct_manifests={str(pathlib.PurePosixPath(x["path"]).parent) for x in results
                            if x["status"]=="DOWNLOADED" and pathlib.PurePosixPath(x["path"]).name=="BUILD_MANIFEST.json"}
          direct_roots=sorted(app_roots & direct_manifests)
          archives=[]
          for item in results:
              if item["status"]!="DOWNLOADED":
                  continue
              p=files_root.joinpath(*pathlib.PurePosixPath(item["path"]).parts)
              low=p.name.casefold()
              if low.endswith(".zip"):
                  try:
                      with zipfile.ZipFile(p) as z:
                          members=[x for x in z.namelist() if not x.endswith("/")]
                          safe=all(not pathlib.PurePosixPath(x).is_absolute() and ".." not in pathlib.PurePosixPath(x).parts for x in members)
                          package_roots={str(pathlib.PurePosixPath(x).parent) for x in members if pathlib.PurePosixPath(x).name=="package.json"}
                          manifest_roots={str(pathlib.PurePosixPath(x).parent) for x in members if pathlib.PurePosixPath(x).name=="BUILD_MANIFEST.json"}
                          archives.append({"path":item["path"],"format":"zip","member_count":len(members),"safe_paths":safe,
                                           "application_roots":sorted(package_roots & manifest_roots)})
                  except Exception as exc:
                      archives.append({"path":item["path"],"format":"zip","inspection_error":str(exc)})
              elif low.endswith(".tar.gz") or low.endswith(".tgz"):
                  try:
                      with tarfile.open(p,"r:gz") as t:
                          members=[x.name for x in t.getmembers() if x.isfile()]
                          safe=all(not pathlib.PurePosixPath(x).is_absolute() and ".." not in pathlib.PurePosixPath(x).parts for x in members)
                          package_roots={str(pathlib.PurePosixPath(x).parent) for x in members if pathlib.PurePosixPath(x).name=="package.json"}
                          manifest_roots={str(pathlib.PurePosixPath(x).parent) for x in members if pathlib.PurePosixPath(x).name=="BUILD_MANIFEST.json"}
                          archives.append({"path":item["path"],"format":"tar.gz","member_count":len(members),"safe_paths":safe,
                                           "application_roots":sorted(package_roots & manifest_roots)})
                  except Exception as exc:
                      archives.append({"path":item["path"],"format":"tar.gz","inspection_error":str(exc)})

          failed=sum(x["status"]!="DOWNLOADED" for x in results)
          inventory={"drive_folder_id": "1o4y6s2hP81sNra93112s2V7ldJNty9-2",
                     "listed_file_count":len(listing),"downloaded_file_count":len(results)-failed,
                     "failed_file_count":failed,"files":results,"direct_application_roots":direct_roots,
                     "archives":archives}
          (root/"drive-folder-inventory.json").write_text(json.dumps(inventory,indent=2),encoding="utf-8")
          summary=[
            "# Authoritative Drive folder inventory","",
            f"- Drive folder ID: `{inventory['drive_folder_id']}`",
            f"- Listed files: {len(listing)}",
            f"- Downloaded: {len(listing)-failed}",
            f"- Failed: {failed}",
            f"- Direct app roots (package + manifest): {len(direct_roots)}",
            f"- Archives detected: {len(archives)}","",
            "## File inventory"
          ]
          for x in results:
              summary.append(f"- `{x['path']}`: {x['status']}, size={x.get('size_bytes','')}, SHA-256={x.get('sha256','')}, error={x.get('error','')}")
          summary += ["","## Application archive inspection"]
          for x in archives:
              summary.append(f"- `{x['path']}`: {json.dumps(x,sort_keys=True)}")
          summary += ["","## Intake decision","",
                      "This workflow downloads and inventories the source folder only. It does not alter the committed application tree. A source application may be promoted only after its complete extracted root, build manifest, per-file hashes, licensing/provenance and scope compatibility are reviewed."]
          (root/"drive-folder-inventory.md").write_text("\n".join(summary)+"\n",encoding="utf-8")
          (root/"SHA256SUMS.txt").write_text("\n".join(f"{x.get('sha256','')}  {x['path']}" for x in results if x["status"]=="DOWNLOADED")+"\n",encoding="utf-8")
          print((root/"drive-folder-inventory.md").read_text(encoding="utf-8"))
          PY

      - name: Publish downloaded Drive source files and inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-drive-folder-download
          path: ${{ runner.temp }}/drive-intake-download/
          if-no-files-found: error
          retention-days: 14

      - name: Add source inventory to GitHub Actions summary
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/drive-intake-download/drive-folder-inventory.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
