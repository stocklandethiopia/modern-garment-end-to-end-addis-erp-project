name: Audit authoritative Stockland source folder

on:
  push:
    branches:
      - audit/stockland-local-source-v0.3.0
    paths:
      - source-intake/stockland-garment-erp-local-v0.3.0/AUTHORITATIVE_SOURCE_REVIEW_TRIGGER
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-drive-source:
    name: Verify authoritative Drive manifest, source files and adoption references
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRIVE_FOLDER_ID: 146liRDU7W1-kWZxgN_LGklEgsUlAFTLE
      IMPORTED_SOURCE: source-intake/stockland-garment-erp-local-v0.3.0/source
    steps:
      - name: Checkout current committed application
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Drive folder listing without bulk downloading all folder contents
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "gdown==5.2.0"
          python - "$DRIVE_FOLDER_ID" "$RUNNER_TEMP/drive-listing.json" <<'PY'
          import sys, json, gdown
          folder_id, output = sys.argv[1], sys.argv[2]
          files = gdown.download_folder(
              url=f"https://drive.google.com/drive/folders/{folder_id}",
              quiet=True,
              remaining_ok=True,
              skip_download=True,
          )
          payload = []
          for f in files or []:
              payload.append({"id": f.id, "path": f.path, "local_path": f.local_path})
          with open(output,"w",encoding="utf-8") as out:
              json.dump(payload,out,indent=2)
          print(f"Drive folder listing resolved: {len(payload)} files.")
          PY
          echo "DRIVE_LISTING=$RUNNER_TEMP/drive-listing.json" >> "$GITHUB_ENV"

      - name: Download the candidate application manifest and verify exact application folder identity
        shell: bash
        run: |
          set -euo pipefail
          python - "$DRIVE_LISTING" "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/app-root.txt" <<'PY'
          import sys, json, pathlib, gdown
          listing=json.load(open(sys.argv[1],encoding="utf-8"))
          manifests=[x for x in listing if pathlib.PurePosixPath(x["path"]).name=="BUILD_MANIFEST.json"]
          packages={str(pathlib.PurePosixPath(x["path"]).parent) for x in listing if pathlib.PurePosixPath(x["path"]).name=="package.json"}
          candidates=[]
          for x in manifests:
              root=str(pathlib.PurePosixPath(x["path"]).parent)
              if root in packages:
                  candidates.append((root,x))
          if len(candidates)!=1:
              raise SystemExit(f"Expected exactly one app root containing both package.json and BUILD_MANIFEST.json; found {len(candidates)}. Manifests={[x['path'] for x in manifests]}, package roots={sorted(packages)}")
          root, entry=candidates[0]
          result=gdown.download(id=entry["id"],output=sys.argv[2],quiet=True)
          if not result:
              raise SystemExit("Could not download BUILD_MANIFEST.json from the authoritative Drive folder.")
          pathlib.Path(sys.argv[3]).write_text(root,encoding="utf-8")
          print(f"Application root: {root}")
          print(f"Manifest Drive file ID: {entry['id']}")
          PY
          echo "APP_ROOT=$(cat "$RUNNER_TEMP/app-root.txt")" >> "$GITHUB_ENV"
          echo "MANIFEST_FILE=$RUNNER_TEMP/manifest.json" >> "$GITHUB_ENV"

      - name: Download and hash each manifest-listed source file, then compare with current GitHub import
        shell: bash
        run: |
          set -euo pipefail
          python - "$DRIVE_LISTING" "$APP_ROOT" "$MANIFEST_FILE" "$GITHUB_WORKSPACE/$IMPORTED_SOURCE" "$RUNNER_TEMP/drive-source-audit" <<'PY'
          import sys, json, pathlib, hashlib, concurrent.futures, os, traceback, gdown
          listing=json.load(open(sys.argv[1],encoding="utf-8"))
          app_root=sys.argv[2].strip("/")
          manifest_path=pathlib.Path(sys.argv[3])
          imported=pathlib.Path(sys.argv[4])
          out=pathlib.Path(sys.argv[5]); out.mkdir(parents=True,exist_ok=True)
          manifest_bytes=manifest_path.read_bytes()
          manifest_sha=hashlib.sha256(manifest_bytes).hexdigest()
          manifest=json.loads(manifest_bytes)
          if manifest.get("application")!="Stockland Garment ERP" or manifest.get("version")!="0.3.0":
              raise SystemExit(f"Wrong source package identity: {manifest.get('application')} {manifest.get('version')}")
          entries=manifest.get("files",[])
          if not isinstance(entries,list):
              raise SystemExit("BUILD_MANIFEST.json has no files array.")
          by_path={x["path"].replace("\\","/"):x for x in listing}
          def sha(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for block in iter(lambda:f.read(1024*1024),b""): h.update(block)
              return h.hexdigest()
          tasks=[]
          for e in entries:
              rel=e.get("path")
              if not isinstance(rel,str) or rel.startswith("/") or ".." in pathlib.PurePosixPath(rel).parts:
                  tasks.append((rel,e,None,"unsafe manifest path"))
                  continue
              drive_path=(pathlib.PurePosixPath(app_root)/rel).as_posix()
              item=by_path.get(drive_path)
              if item is None:
                  tasks.append((rel,e,None,"not found in Drive folder listing"))
              else:
                  tasks.append((rel,e,item,None))
          def fetch(task):
              rel,e,item,error=task
              current=imported/rel
              current_sha=sha(current) if current.is_file() else None
              current_size=current.stat().st_size if current.is_file() else None
              result={"path":rel,"expected_sha256":e.get("sha256"),"expected_size":e.get("size_bytes"),
                      "current_git_sha256":current_sha,"current_git_size":current_size}
              if error:
                  result["drive_status"]="missing"
                  result["error"]=error
                  return result
              local=out/"download"/rel
              local.parent.mkdir(parents=True,exist_ok=True)
              try:
                  got=gdown.download(id=item["id"],output=str(local),quiet=True)
                  if not got or not local.is_file():
                      raise RuntimeError("gdown returned no downloaded file")
                  actual_sha=sha(local); actual_size=local.stat().st_size
                  result.update({"drive_file_id":item["id"],"drive_status":"downloaded",
                                 "drive_sha256":actual_sha,"drive_size":actual_size,
                                 "drive_manifest_match":actual_sha==e.get("sha256") and actual_size==e.get("size_bytes"),
                                 "same_as_current_git":actual_sha==current_sha and actual_size==current_size})
              except Exception as exc:
                  result.update({"drive_file_id":item["id"],"drive_status":"blocked_or_failed","error":str(exc)})
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              results=list(pool.map(fetch,tasks))
          # Include the manifest as a separately downloaded, unhashed source control file.
          manifest_report={"application":manifest.get("application"),"version":manifest.get("version"),
                           "declared_file_count":manifest.get("file_count"),"manifest_entries":len(entries),
                           "manifest_sha256":manifest_sha}
          # Capture the exact content of all source/adoption/reference docs that were downloaded.
          evidence=[]
          terms=("reference","adoption","cross","source-review","source_review","provenance","module_mapping","contract")
          for r in results:
              if r["drive_status"]!="downloaded": continue
              p=out/"download"/r["path"]
              if any(t in r["path"].lower() for t in terms) and p.suffix.lower() in (".md",".txt",".csv",".json",".yml",".yaml"):
                  body=p.read_text(encoding="utf-8",errors="replace")
                  if len(body)>30000: body=body[:30000]+"\n[TRUNCATED]"
                  evidence.append({"path":r["path"],"content":body})
          # Enumerate files in the app folder that are outside its build manifest.
          declared={e.get("path") for e in entries if isinstance(e.get("path"),str)}|{"BUILD_MANIFEST.json"}
          extra=[x["path"][len(app_root)+1:] for x in listing if x["path"].startswith(app_root+"/") and x["path"][len(app_root)+1:] not in declared]
          report={"drive_folder_id":os.environ["DRIVE_FOLDER_ID"],"candidate_app_root":app_root,
                  "manifest":manifest_report,"per_file_results":results,"adoption_reference_evidence":evidence,
                  "extra_files_outside_manifest":sorted(extra)}
          (out/"authoritative-drive-source-audit.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          good=sum(r.get("drive_status")=="downloaded" and r.get("drive_manifest_match") and r.get("same_as_current_git") for r in results)
          failed=sum(r.get("drive_status")!="downloaded" for r in results)
          changed=sum(r.get("drive_status")=="downloaded" and not r.get("same_as_current_git") for r in results)
          summary=[
            "# Authoritative Stockland source comparison",
            "",
            f"- Drive folder ID: `{os.environ['DRIVE_FOLDER_ID']}`",
            f"- Candidate app root: `{app_root}`",
            f"- Manifest SHA-256: `{manifest_sha}`",
            f"- Manifest-tracked files: {len(entries)}",
            f"- Downloaded and verified identical to current GitHub import: {good}",
            f"- Drive files blocked/not downloaded: {failed}",
            f"- Downloaded files differing from current GitHub import: {changed}",
            f"- Files outside manifest: {len(extra)}",
            f"- Reference/adoption documents captured: {len(evidence)}",
            "",
            "## Deviations and inaccessible files",
          ]
          for r in results:
              if r.get("drive_status")!="downloaded" or not r.get("same_as_current_git") or not r.get("drive_manifest_match"):
                  summary.append(f"- {r['path']}: status={r.get('drive_status')}, same_as_current={r.get('same_as_current_git')}, manifest_match={r.get('drive_manifest_match')}, error={r.get('error','')}")
          if not any(r.get("drive_status")!="downloaded" or not r.get("same_as_current_git") or not r.get("drive_manifest_match") for r in results):
              summary.append("- None.")
          summary += ["","## Adoption/reference evidence paths"]
          summary += [f"- {e['path']}" for e in evidence]
          (out/"drive-source-summary.md").write_text("\n".join(summary)+"\n",encoding="utf-8")
          print((out/"drive-source-summary.md").read_text(encoding="utf-8"))
          if failed or changed or any(not r.get("drive_manifest_match") for r in results if r.get("drive_status")=="downloaded"):
              print("SOURCE COMPARISON IS NOT FULLY IDENTICAL; review report before replacing repository source.")
          PY

      - name: Publish manifest, file-by-file comparison and reference/adoption evidence
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-stockland-source-comparison
          path: ${{ runner.temp }}/drive-source-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Add comparison report to GitHub Actions summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/drive-source-audit/drive-source-summary.md" ]; then
            cat "$RUNNER_TEMP/drive-source-audit/drive-source-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
